<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager Pro (Ultimate)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { 
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        primary: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            500: '#f43f5e', // Rose 500
                            600: '#e11d48', // Rose 600
                            700: '#be123c', // Rose 700
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fcfcfc; transition: background-color 0.3s; }
        .dark body { background-color: #0f172a; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .gantt-bar { transition: all 0.3s ease; }
        .gantt-bar:hover { transform: scaleY(1.1); filter: brightness(1.1); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Toast Animation */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }

        /* Print Styles */
        @media print {
            header, .no-print, #dataMenu, #toast-container { display: none !important; }
            body { background-color: white !important; color: black !important; }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl { box-shadow: none !important; }
            #viewContent { padding: 0 !important; max-width: 100% !important; }
            .bg-slate-50 { background-color: white !important; }
        }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden font-sans bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

    <!-- Top Navigation -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 h-16 flex-none z-30 shadow-sm transition-colors duration-300">
        <div class="h-full max-w-[1600px] mx-auto px-4 flex items-center justify-between">
            <!-- Logo & View Switcher -->
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-900 dark:text-white cursor-pointer" onclick="location.reload()">
                    <div class="bg-primary-600 text-white p-1.5 rounded-lg shadow-primary-200 dark:shadow-none shadow-lg transform hover:rotate-3 transition-transform">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    PM<span class="text-slate-400 font-normal">Pro</span>
                </div>
                
                <nav class="hidden md:flex bg-slate-50 dark:bg-slate-700/50 p-1 rounded-lg border border-slate-200 dark:border-slate-600">
                    <button onclick="switchView('dashboard')" id="nav-dashboard" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 hover:text-primary-600 dark:hover:text-primary-400"><i class="fa-solid fa-chart-pie text-xs"></i> Dash</button>
                    <button onclick="switchView('gallery')" id="nav-gallery" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 hover:text-primary-600 dark:hover:text-primary-400"><i class="fa-solid fa-grip text-xs"></i> Gallery</button>
                    <button onclick="switchView('kanban')" id="nav-kanban" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 hover:text-primary-600 dark:hover:text-primary-400"><i class="fa-solid fa-columns text-xs"></i> Kanban</button>
                    <button onclick="switchView('list')" id="nav-list" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 hover:text-primary-600 dark:hover:text-primary-400"><i class="fa-solid fa-list text-xs"></i> List</button>
                    <button onclick="switchView('timeline')" id="nav-timeline" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-2 hover:text-primary-600 dark:hover:text-primary-400"><i class="fa-solid fa-timeline text-xs"></i> Timeline</button>
                </nav>
            </div>

            <!-- Filters & Actions -->
            <div class="flex items-center gap-3">
                <!-- Filters -->
                <div class="hidden xl:flex items-center gap-2 mr-2">
                    <select id="filterStatus" onchange="store.render()" class="text-xs border-none bg-slate-100 dark:bg-slate-700 dark:text-slate-200 rounded-full px-3 py-1.5 focus:ring-1 focus:ring-primary-500 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <option value="all">All Status</option>
                        <option value="todo">Todo</option>
                        <option value="doing">Doing</option>
                        <option value="done">Done</option>
                        <option value="overdue">Overdue</option>
                    </select>
                    <select id="filterOwner" onchange="store.render()" class="text-xs border-none bg-slate-100 dark:bg-slate-700 dark:text-slate-200 rounded-full px-3 py-1.5 focus:ring-1 focus:ring-primary-500 cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                        <option value="all">All Owners</option>
                    </select>
                </div>

                <!-- Search -->
                <div class="relative hidden sm:block group">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm group-focus-within:text-primary-500 transition-colors"></i>
                    <input type="text" id="globalSearch" oninput="handleSearch(this.value)" placeholder="Search projects..." 
                        class="pl-9 pr-4 py-1.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 dark:text-white w-32 lg:w-48 focus:w-64 transition-all">
                </div>
                
                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

                <!-- Dark Mode Toggle -->
                <button onclick="store.toggleTheme()" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-500 hover:text-primary-600 hover:bg-primary-50 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors" title="Toggle Theme">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>

                <!-- Data Management -->
                <div class="flex items-center gap-1 relative">
                    <button onclick="document.getElementById('dataMenu').classList.toggle('hidden')" class="w-8 h-8 flex items-center justify-center rounded-full text-slate-500 hover:text-primary-600 hover:bg-primary-50 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors" title="Data Management">
                        <i class="fa-solid fa-database"></i>
                    </button>
                    <!-- Dropdown -->
                    <div id="dataMenu" class="hidden absolute top-10 right-0 w-56 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden z-50 text-left">
                        <div class="p-2 space-y-1">
                            <button onclick="app.generateMockData()" class="w-full text-left px-3 py-2 text-xs font-medium text-purple-600 dark:text-purple-400 hover:bg-purple-50 dark:hover:bg-purple-900/30 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-magic-wand-sparkles"></i> Generate Mock Data
                            </button>
                            <div class="h-px bg-slate-100 dark:bg-slate-700 my-1"></div>
                            <button onclick="app.exportJSON()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-download text-primary-500"></i> Backup JSON
                            </button>
                            <button onclick="document.getElementById('importJSON').click()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-upload text-blue-500"></i> Restore JSON
                            </button>
                            <div class="h-px bg-slate-100 dark:bg-slate-700 my-1"></div>
                            <button onclick="app.exportCSV()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-file-csv text-green-500"></i> Export CSV
                            </button>
                            <button onclick="document.getElementById('importFile').click()" class="w-full text-left px-3 py-2 text-xs font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-file-import text-orange-500"></i> Import CSV
                            </button>
                            <div class="h-px bg-slate-100 dark:bg-slate-700 my-1"></div>
                            <button onclick="app.resetData()" class="w-full text-left px-3 py-2 text-xs font-medium text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg flex items-center gap-2">
                                <i class="fa-solid fa-trash-can"></i> Reset All Data
                            </button>
                        </div>
                    </div>
                    <!-- Hidden Inputs -->
                    <input type="file" id="importFile" accept=".csv" class="hidden" onchange="app.importCSV(this)">
                    <input type="file" id="importJSON" accept=".json" class="hidden" onchange="app.importJSON(this)">
                </div>
                
                <button onclick="app.openEditor()" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-full text-sm font-medium shadow-md shadow-primary-200 dark:shadow-none transition-all transform active:scale-95 flex items-center gap-2 ml-2 no-print">
                    <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">New</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto relative bg-slate-50 dark:bg-slate-900 transition-colors duration-300" id="mainContainer" onclick="document.getElementById('dataMenu').classList.add('hidden')">
        <div class="max-w-[1600px] mx-auto p-4 md:p-6 pb-20" id="viewContent">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <!-- Modal: Editor -->
    <div id="editorModal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="app.closeEditor()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col fade-in transform transition-all scale-100 border border-slate-200 dark:border-slate-700">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center shrink-0 bg-primary-50/30 dark:bg-slate-800 rounded-t-2xl">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2">
                        <span class="w-2 h-6 bg-primary-600 rounded-full"></span>
                        <span id="editorTitle">Edit Project</span>
                    </h3>
                    <button onclick="app.closeEditor()" class="text-slate-400 hover:text-primary-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-primary-50 dark:hover:bg-slate-700">
                        <i class="fa-solid fa-times text-lg"></i>
                    </button>
                </div>
                
                <form id="editorForm" onsubmit="app.saveProject(event)" class="overflow-y-auto p-6 space-y-6 custom-scroll">
                    <input type="hidden" name="id">
                    
                    <!-- Cover Image Upload -->
                    <div class="bg-primary-50/50 dark:bg-slate-700/50 p-4 rounded-xl border border-primary-100 dark:border-slate-600">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block mb-2">Cover Image</label>
                        <div class="flex items-center gap-4">
                            <div id="coverPreview" class="w-20 h-20 rounded-lg bg-white dark:bg-slate-600 border border-primary-200 dark:border-slate-500 flex items-center justify-center overflow-hidden bg-cover bg-center shadow-sm relative group">
                                <i class="fa-solid fa-image text-slate-300 dark:text-slate-400 text-2xl group-hover:scale-110 transition-transform"></i>
                            </div>
                            <div class="flex-1">
                                <input type="file" id="coverInput" accept="image/*" class="block w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-primary-100 file:text-primary-700 dark:file:bg-slate-600 dark:file:text-white hover:file:bg-primary-200 transition-all cursor-pointer">
                                <input type="hidden" name="coverUrl">
                                <p class="text-[10px] text-slate-400 mt-1">* รูปจะถูกย่อขนาดอัตโนมัติเพื่อประหยัดพื้นที่</p>
                                <button type="button" onclick="app.removeCover()" id="btnRemoveCover" class="text-xs text-red-500 hover:text-red-700 mt-1 hidden font-medium"><i class="fa-solid fa-trash-can mr-1"></i>ลบรูปภาพ</button>
                            </div>
                        </div>
                    </div>

                    <!-- Top Row -->
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-5">
                        <div class="md:col-span-8 space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Project Name <span class="text-primary-500">*</span></label>
                            <input type="text" name="name" required placeholder="Enter project name..." class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-shadow">
                        </div>
                        <div class="md:col-span-4 space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Run Code</label>
                            <input type="text" name="runCode" readonly class="w-full bg-slate-100 dark:bg-slate-600 border border-slate-200 dark:border-slate-500 text-slate-600 dark:text-slate-300 font-mono font-medium rounded-lg px-4 py-2.5 text-sm cursor-not-allowed">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Category</label>
                            <select name="cataglory" onchange="app.autoRunCode()" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2.5 text-sm bg-white focus:ring-2 focus:ring-primary-500">
                                <option value="">-- Select Category --</option>
                                <option value="New Product (Factory)">New Product (Factory)</option>
                                <option value="New Product (SSSC)">New Product (SSSC)</option>
                                <option value="Improvement">Improvement</option>
                                <option value="New Product Y (Follow up)">New Product Y (Follow up)</option>
                                <option value="Mini House Product">Mini House Product</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Status</label>
                            <select name="status" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2.5 text-sm bg-white focus:ring-2 focus:ring-primary-500">
                                <option value="todo">Todo</option>
                                <option value="doing">Doing</option>
                                <option value="done">Done</option>
                                <option value="overdue">Overdue</option>
                            </select>
                        </div>
                    </div>

                    <!-- Owners -->
                    <div class="grid grid-cols-2 gap-5 bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl border border-slate-100 dark:border-slate-700">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Response (Eng)</label>
                            <input list="engList" name="responseEng" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-primary-500">
                            <datalist id="engList"><option value="Pui"><option value="Beer"><option value="Pat"><option value="Shoe"></datalist>
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Response (Tech)</label>
                            <input list="techList" name="responseTech" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-primary-500">
                            <datalist id="techList"><option value="Toi"><option value="Ter"><option value="Nuch"><option value="Amp"><option value="Wat"></datalist>
                        </div>
                    </div>

                    <!-- Dates -->
                    <div class="grid grid-cols-2 gap-5">
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Start Date</label>
                            <input type="date" name="start" onchange="app.autoEndDate(this.value)" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm text-slate-600 focus:ring-primary-500">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Due Date</label>
                            <input type="date" name="due" class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm text-slate-600 focus:ring-primary-500">
                        </div>
                    </div>

                    <!-- Subtasks -->
                    <div class="bg-white dark:bg-slate-700 rounded-xl border-2 border-slate-100 dark:border-slate-600 overflow-hidden">
                        <div class="bg-slate-50 dark:bg-slate-800 px-4 py-3 border-b border-slate-100 dark:border-slate-600 flex justify-between items-center">
                            <label class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-primary-500"></i> Subtasks (S1-S5)
                            </label>
                            <div class="text-xs text-slate-500 dark:text-slate-400">
                                Total Progress: <span id="totalProgress" class="font-bold text-primary-600 dark:text-primary-400 text-base ml-1">0%</span>
                            </div>
                        </div>
                        <div class="p-4 space-y-3" id="subtaskList">
                            <!-- JS will populate this -->
                        </div>
                        <div id="weightWarning" class="px-4 py-2 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs font-medium border-t border-red-100 dark:border-red-900 flex items-center gap-2 hidden">
                            <i class="fa-solid fa-triangle-exclamation"></i> Total weight must be 100%
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Notes</label>
                        <textarea name="notes" rows="3" placeholder="Additional details..." class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2 text-sm focus:ring-primary-500"></textarea>
                    </div>

                </form>

                <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex justify-between items-center shrink-0 rounded-b-2xl">
                    <button type="button" onclick="store.delete(document.getElementById('editorForm').id.value); app.closeEditor()" class="text-red-500 hover:text-red-700 dark:hover:text-red-400 text-sm font-medium px-2" id="btnDeleteProject">
                        <i class="fa-solid fa-trash-can mr-1"></i> Delete
                    </button>
                    <div class="flex gap-3">
                        <button onclick="app.closeEditor()" class="px-5 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 hover:shadow-sm border border-transparent hover:border-slate-200 dark:hover:border-slate-600 rounded-lg transition-all">Cancel</button>
                        <button onclick="document.getElementById('editorForm').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))" class="px-5 py-2.5 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-lg shadow-lg shadow-primary-200 dark:shadow-none transition-all transform active:scale-95">Save Project</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- Utils ---
        const LS_KEY = "pm_projects_v2";
        const LS_THEME = "pm_theme";
        const generateId = () => 'p_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        
        const DEFAULT_SUBTASKS = [
            { key: "S1", name: "S1 Test & Assembly" },
            { key: "S2", name: "S2 Planning Rule&Variation" },
            { key: "S3", name: "S3 Standard part" },
            { key: "S4", name: "S4 Coding Rule" },
            { key: "S5", name: "S5 Spec Change" }
        ];

        const RUN_CODE_PREFIX = {
            "New Product (Factory)": "A", "New Product (SSSC)": "B", "Improvement": "C",
            "New Product Y (Follow up)": "D", "Mini House Product": "E"
        };

        const CATEGORIES = [
            "New Product (Factory)",
            "New Product (SSSC)",
            "Improvement",
            "New Product Y (Follow up)",
            "Mini House Product"
        ];

        // --- State Management ---
        const store = {
            projects: [],
            view: 'dashboard',
            search: '',
            galleryFilter: 'all', 
            
            init() {
                // Load Theme
                const theme = localStorage.getItem(LS_THEME);
                if(theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }

                try {
                    const raw = localStorage.getItem(LS_KEY);
                    this.projects = raw ? JSON.parse(raw) : [];
                } catch(e) { this.projects = []; }
                this.populateFilters();
                this.render();
            },
            
            save() {
                try {
                    localStorage.setItem(LS_KEY, JSON.stringify(this.projects));
                } catch (e) {
                    app.toast('Storage full! Cannot save changes.', 'error');
                    console.error(e);
                }
                this.populateFilters();
                this.render();
            },

            toggleTheme() {
                document.documentElement.classList.toggle('dark');
                localStorage.setItem(LS_THEME, document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            },

            addOrUpdate(p) {
                const idx = this.projects.findIndex(x => x.id === p.id);
                if (idx > -1) this.projects[idx] = p;
                else this.projects.unshift(p);
                this.save();
                app.toast(idx > -1 ? 'Project updated successfully' : 'New project created');
            },

            delete(id) {
                if(!id) return;
                if(!confirm('Are you sure you want to delete this project?')) return;
                this.projects = this.projects.filter(p => p.id !== id);
                this.save();
                app.closeEditor();
                app.toast('Project deleted');

            filtered() {
                const q = this.search.toLowerCase();
                const statusF = document.getElementById('filterStatus')?.value || 'all';
                const ownerF = document.getElementById('filterOwner')?.value || 'all';

                return this.projects.filter(p => {
                    const matchesSearch = !q || (p.name+p.cataglory+p.runCode+(p.responseEng||"")+(p.responseTech||"")).toLowerCase().includes(q);
                    const matchesStatus = statusF === 'all' || (p.status || 'todo') === statusF;
                    const matchesOwner = ownerF === 'all' || (p.responseEng === ownerF || p.responseTech === ownerF);
                    return matchesSearch && matchesStatus && matchesOwner;
                }).sort((a,b) => (a.due||"9999").localeCompare(b.due||"9999"));
            },

            populateFilters() {
                const ownerSelect = document.getElementById('filterOwner');
                if(!ownerSelect) return;
                const current = ownerSelect.value;
                const owners = new Set();
                this.projects.forEach(p => {
                    if(p.responseEng) owners.add(p.responseEng);
                    if(p.responseTech) owners.add(p.responseTech);
                });
                ownerSelect.innerHTML = '<option value="all">All Owners</option>' + 
                    [...owners].sort().map(o => `<option value="${o}">${o}</option>`).join('');
                ownerSelect.value = current;
            },

            setGalleryFilter(val) {
                this.galleryFilter = val;
                this.render();
            },

            render() {
                renderView(this.view);
                updateNav(this.view);
            }

                if(startVal && !form.due.value) {
                    const d = new Date(startVal);
                    d.setDate(d.getDate() + 30); 
                    form.due.value = d.toISOString().split('T')[0];
                }
            },

            autoRunCode() {
                const form = document.getElementById('editorForm');
                const cat = form.cataglory.value;
                const prefix = RUN_CODE_PREFIX[cat];
                
                if(form.id.value) {
                    const existing = store.projects.find(p => p.id === form.id.value);
                    if(existing && existing.cataglory === cat && existing.runCode) {
                        form.runCode.value = existing.runCode;
                        return;
                    }
                }

                if(!prefix) {
                    form.runCode.value = "";
                    return;
                }

                let max = 0;
                store.projects.forEach(p => {
                    if(p.runCode && p.runCode.startsWith(prefix)) {
                        const num = parseInt(p.runCode.replace(prefix, ''));
                        if(!isNaN(num) && num > max) max = num;
                    }
                });
                
                const next = max + 1;
                form.runCode.value = prefix + next.toString().padStart(2, '0');
            },

                                <input type="date" name="t_end_${i}" value="${t.end}" class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded px-2 py-1.5 text-xs text-slate-500 dark:text-slate-400">
                            </div>

                                <span class="text-xs text-slate-400 w-4">%</span>
                            </div>
                            <div class="md:col-span-3 flex items-center gap-2">
                                <input type="range" name="t_progress_${i}" value="${t.progress}" oninput="this.nextElementSibling.innerText=this.value+'%'; app.calcTotal()" class="w-full h-1.5 bg-slate-200 dark:bg-slate-600 rounded-lg appearance-none cursor-pointer accent-primary-600">

                            </div>

                    `;

                this.calcTotal();
            },

            calcTotal() {
                const form = document.getElementById('editorForm');
                let totalW = 0;
                let weightedProg = 0;
                
                for(let i=0; i<5; i++) {
                    const w = Number(form[`t_weight_${i}`].value) || 0;
                    const p = Number(form[`t_progress_${i}`].value) || 0;
                    totalW += w;
                    weightedProg += (p * w);
                }
                
                const finalP = totalW > 0 ? Math.round(weightedProg / totalW) : 0;
                document.getElementById('totalProgress').innerText = finalP + '%';
                
                const warn = document.getElementById('weightWarning');
                if(totalW !== 100) {
                    warn.classList.remove('hidden');
                    warn.innerText = `Total weight is ${totalW}% (should be 100%)`;
                } else {
                    warn.classList.add('hidden');
                }
                return finalP;
            },

            removeCover() {
                document.querySelector('[name="coverUrl"]').value = '';
                const preview = document.getElementById('coverPreview');
                preview.style.backgroundImage = 'none';
                preview.innerHTML = '<i class="fa-solid fa-image text-slate-300 dark:text-slate-400 text-2xl group-hover:scale-110 transition-transform"></i>';
                document.getElementById('btnRemoveCover').classList.add('hidden');
                document.getElementById('coverInput').value = '';
            },

                };

                this.closeEditor();

            // --- DATA MANAGEMENT ---
            
            generateMockData() {

            exportCSV() {
                const headers = ["ID","Name","Category","RunCode","RespEng","RespTech","Start","Due","Status","Progress","Notes","CoverUrl"];
                const rows = [headers.join(",")];
                store.projects.forEach(p => {
                    const safe = (txt) => `"${(txt || '').replace(/"/g, '""')}"`;
                    const row = [
                        p.id, safe(p.name), safe(p.cataglory), safe(p.runCode), 
                        safe(p.responseEng), safe(p.responseTech), 
                        p.start, p.due, p.status, p.progress, safe(p.notes),
                        safe(p.coverUrl ? "IMAGE_DATA_PRESENT" : "")
                    ];
                    rows.push(row.join(","));
                });
                
                const BOM = "\uFEFF"; 
                const blob = new Blob([BOM + rows.join("\n")], { type: "text/csv;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = `PMPro_Export_${new Date().toISOString().slice(0,10)}.csv`; a.click();
            },
            
            importCSV(input) {
                const file = input.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const parseDate = (d) => {
                        if(!d) return "";
                        const parts = d.split('-');
                        if(parts.length !== 3) return d;
                        let [day, month, year] = parts;
                        if(year.length === 2) year = "20" + year;
                        return `${year}-${month}-${day}`;
                    };

                    const rows = text.split('\n').map(r => r.trim()).filter(r => r);
                    if(rows.length < 2) return;

                    const projectMap = new Map();

                    for(let i=1; i<rows.length; i++) {
                        const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
                        if(cols.length < 5) continue;

                        const runCode = cols[1];
                        const name = cols[2];
                        const key = (runCode || name || "").toLowerCase(); 

                        if(!key) continue;

                        let p = projectMap.get(key);
                        if(!p) {
                            p = {
                                id: generateId(),
                                cataglory: cols[0],
                                runCode: runCode,
                                name: name,
                                responseEng: cols[3],
                                responseTech: cols[4],
                                start: parseDate(cols[5]),
                                due: parseDate(cols[6]),
                                status: (cols[7] || 'todo').toLowerCase(),
                                progress: parseInt(cols[8].replace('%','')) || 0,
                                notes: cols[13] || "",
                                coverUrl: "", 
                                tasks: JSON.parse(JSON.stringify(DEFAULT_SUBTASKS)).map(t => ({...t, weight: 20, progress: 0, start: '', end: ''})) 
                            };
                            projectMap.set(key, p);
                        }

                        const taskNameFromCSV = cols[9];
                        if(taskNameFromCSV) {
                            const match = taskNameFromCSV.match(/^(S[1-5])/i);
                            let taskIdx = -1;
                            if(match) {
                                const k = match[1].toUpperCase();
                                taskIdx = p.tasks.findIndex(t => t.key === k);
                            }
                            if(taskIdx > -1) {
                                p.tasks[taskIdx].name = taskNameFromCSV;
                                p.tasks[taskIdx].start = parseDate(cols[10]);
                                p.tasks[taskIdx].end = parseDate(cols[11]);
                                p.tasks[taskIdx].progress = parseInt(cols[12].replace('%','')) || 0;
                            }
                        }
                    }

                    const newProjects = Array.from(projectMap.values());
                    newProjects.forEach(p => {
                         let totalW = 0;
                         let weightedProg = 0;
                         p.tasks.forEach(t => {
                             totalW += t.weight;
                             weightedProg += (t.progress * t.weight);
                         });
                         if(totalW > 0) p.progress = Math.round(weightedProg / totalW);
                    });

                    let added = 0;
                    newProjects.forEach(np => {
                        const exists = store.projects.find(ex => (ex.runCode && ex.runCode === np.runCode) || (ex.name && ex.name === np.name));
                        if(!exists) {
                            store.projects.push(np);
                            added++;
                        }
                    });

                    store.save();
                    app.toast(`Imported ${added} new projects.`);
                    input.value = '';
                };
                reader.readAsText(file);
            },

            exportJSON() {
                const dataStr = JSON.stringify(store.projects, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `PMPro_Backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            },

            importJSON(input) {
                const file = input.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data)) {
                            if(confirm(`Found ${data.length} projects in backup. Replace current data?`)) {
                                store.projects = data;
                                store.save();
                                app.toast("Data restored successfully!");
                            }
                        } else {
                            app.toast("Invalid JSON format", "error");
                        }
                    } catch (err) {
                        app.toast("Error parsing JSON", "error");
                    }
                    input.value = '';
                };
                reader.readAsText(file);
            },

            resetData() {
                if(confirm("WARNING: This will delete ALL projects permanently. Are you sure?")) {
                    store.projects = [];
                    store.save();
                    app.toast("All data has been reset", "error");
                }
            }

        function resizeImage(file, maxWidth, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                            <h4 class="font-bold text-slate-800 dark:text-white mb-6 flex items-center gap-2">
                                <i class="fa-solid fa-chart-pie text-primary-500"></i> Status Distribution
                            </h4>
                            <div class="h-64 flex items-center justify-center">
                                <canvas id="statusChart"></canvas>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col">
                            <h4 class="font-bold text-slate-800 dark:text-white mb-6 flex items-center gap-2">
                                <i class="fa-regular fa-clock text-primary-500"></i> Upcoming Deadlines
                            </h4>
                            <div class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scroll">
                                ${data.filter(p => p.status !== 'done' && p.due).slice(0, 6).map(p => `
                                    <div class="flex items-center gap-3 p-3 rounded-xl border border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:border-slate-200 dark:hover:border-slate-600 transition cursor-pointer" onclick="app.openEditor('${p.id}')">
                                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-xs ring-4 ring-slate-50 dark:ring-slate-700 ${p.progress >= 80 ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 dark:bg-slate-600 text-slate-500'}">
                                            ${p.progress}%
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="font-bold text-sm truncate text-slate-900 dark:text-white">${p.name}</div>
                                            <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                                                <i class="fa-regular fa-calendar-days text-[10px]"></i> ${p.due}
                                            </div>
                                        </div>
                                        <span class="text-[10px] px-2.5 py-1 rounded-full uppercase font-bold tracking-wide ${getStatusColor(p.status)}">${p.status}</span>
                                    </div>
                                `).join('') || '<div class="text-center text-slate-400 dark:text-slate-500 py-10">No upcoming tasks</div>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Todo', 'Doing', 'Done', 'Overdue'],
                        datasets: [{
                            data: [counts.todo, counts.doing, counts.done, counts.overdue],
                            backgroundColor: ['#f1f5f9', '#3b82f6', '#10b981', '#f43f5e'],
                            hoverOffset: 4,
                            borderWidth: 0
                        }]
                    },
                    options: { 
                        cutout: '75%', 
                        plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20 } } },
                        maintainAspectRatio: false
                    }
                });
            }, 0);
        }

        function renderGallery(el, data) {
            if(!data.length) { el.innerHTML = `<div class="text-center py-20 text-slate-400">No projects found.</div>`; return; }
            
            const allCats = [...new Set(data.map(p => p.cataglory || 'Uncategorized'))].sort();
            const currentFilter = store.galleryFilter || 'all';
            const displayCats = currentFilter === 'all' ? allCats : [currentFilter];

            const filterHTML = `
                <div class="flex flex-wrap gap-2 mb-6 sticky top-0 z-20 bg-slate-50 dark:bg-slate-900 py-2 no-scrollbar overflow-x-auto">
                    <button onclick="store.setGalleryFilter('all')" 
                        class="px-4 py-1.5 rounded-full text-xs font-bold transition-all border shrink-0 ${currentFilter === 'all' ? 'bg-primary-600 text-white border-primary-600 shadow-md transform scale-105' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:border-primary-300 hover:text-primary-600'}">
                        ALL
                    </button>
                    ${allCats.map(cat => `
                        <button onclick="store.setGalleryFilter('${cat.replace(/'/g, "\\'")}')" 
                            class="px-4 py-1.5 rounded-full text-xs font-bold transition-all border shrink-0 ${currentFilter === cat ? 'bg-primary-600 text-white border-primary-600 shadow-md transform scale-105' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600 hover:border-primary-300 hover:text-primary-600'}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>
            `;
            
            el.innerHTML = `
                <div class="fade-in pb-10">
                    ${filterHTML}
                    <div class="space-y-12">
                        ${displayCats.map(cat => `
                            <div>
                                <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-5 flex items-center gap-2 border-b border-slate-200 dark:border-slate-700 pb-2">
                                    <span class="w-2 h-6 bg-primary-600 rounded-full"></span>
                                    ${cat} 
                                    <span class="text-sm font-normal text-slate-400 bg-white dark:bg-slate-800 px-2 py-0.5 rounded-full border border-slate-200 dark:border-slate-600 shadow-sm ml-2">${data.filter(p=>(p.cataglory||'Uncategorized')===cat).length}</span>
                                </h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    ${data.filter(p=>(p.cataglory||'Uncategorized')===cat).map(p => `
                                        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden hover:shadow-xl hover:shadow-primary-100 dark:hover:shadow-none hover:-translate-y-1 transition-all group cursor-pointer flex flex-col h-full" onclick="app.openEditor('${p.id}')">
                                            <div class="h-40 relative bg-slate-100 dark:bg-slate-700 flex items-center justify-center overflow-hidden">
                                                ${p.coverUrl ? 
                                                    `<div class="w-full h-full bg-cover bg-center transition-transform duration-700 group-hover:scale-110" style="background-image: url('${p.coverUrl}')"></div>` : 
                                                    `<i class="fa-solid fa-image text-slate-300 dark:text-slate-500 text-4xl group-hover:scale-110 transition-transform"></i>`
                                                }
                                                <div class="absolute top-0 left-0 right-0 p-3 bg-gradient-to-b from-black/40 to-transparent">
                                                    <div class="flex justify-between items-start">
                                                        <span class="text-[10px] font-mono text-white bg-black/30 backdrop-blur px-1.5 py-0.5 rounded border border-white/20">${p.runCode || '#'}</span>
                                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase shadow-sm ${getStatusColor(p.status)}">${p.status}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="p-5 flex-1 flex flex-col">
                                                <div class="flex -space-x-2 mb-3">
                                                     ${p.responseEng ? `<div class="w-6 h-6 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center text-[10px] font-bold border-2 border-white" title="Eng: ${p.responseEng}">${p.responseEng[0]}</div>` : ''}
                                                     ${p.responseTech ? `<div class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-[10px] font-bold border-2 border-white" title="Tech: ${p.responseTech}">${p.responseTech[0]}</div>` : ''}
                                                </div>
                                                <h4 class="font-bold text-slate-900 dark:text-white line-clamp-2 mb-2 group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors leading-snug">${p.name}</h4>
                                                <div class="mt-auto pt-3 border-t border-slate-50 dark:border-slate-700">
                                                    <div class="flex justify-between items-center text-xs text-slate-500 dark:text-slate-400 mb-1.5">
                                                        <span>Progress</span>
                                                        <span class="font-mono font-bold text-primary-600 dark:text-primary-400">${p.progress}%</span>
                                                    </div>
                                                    <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-1.5 overflow-hidden">
                                                        <div class="bg-primary-500 h-full rounded-full" style="width: ${p.progress}%"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        }
        
        function renderKanban(el, data) {
            const cols = ['todo', 'doing', 'done', 'overdue'];
            el.innerHTML = `
                <div class="grid grid-cols-4 gap-6 h-[calc(100vh-160px)] fade-in overflow-hidden">
                    ${cols.map(col => `
                        <div class="flex flex-col h-full bg-slate-100/70 dark:bg-slate-800/50 rounded-2xl border border-slate-200 dark:border-slate-700">
                            <div class="p-4 font-bold text-slate-700 dark:text-slate-300 uppercase text-xs flex justify-between items-center bg-slate-100 dark:bg-slate-800 rounded-t-2xl border-b border-slate-200 dark:border-slate-700">
                                ${col} <span class="bg-white dark:bg-slate-700 px-2 py-0.5 rounded-full shadow-sm text-slate-500 dark:text-slate-300 min-w-[24px] text-center">${data.filter(p=>(p.status||'todo')===col).length}</span>
                            </div>
                            <div class="flex-1 overflow-y-auto p-3 space-y-3 custom-scroll">
                                ${data.filter(p=>(p.status||'todo')===col).map(p => `
                                    <div class="bg-white dark:bg-slate-800 p-0 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md cursor-pointer transition-all group relative overflow-hidden" onclick="app.openEditor('${p.id}')">
                                        ${p.coverUrl ? `<div class="h-20 w-full bg-cover bg-center" style="background-image: url('${p.coverUrl}')"></div>` : ''}
                                        <div class="p-3">
                                            <h5 class="font-bold text-sm text-slate-800 dark:text-white mb-2 leading-snug">${p.name}</h5>
                                            <div class="flex items-center gap-2 mb-3">
                                                <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full">
                                                    <div class="bg-primary-600 h-1.5 rounded-full" style="width: ${p.progress}%"></div>
                                                </div>
                                                <span class="text-[10px] font-mono text-slate-500 dark:text-slate-400 font-bold">${p.progress}%</span>
                                            </div>
                                            <div class="flex items-center justify-between">
                                                <span class="text-[10px] font-mono text-slate-400 border px-1 rounded dark:border-slate-600">${p.runCode || '#'}</span>
                                                <span class="text-[10px] text-slate-400 dark:text-slate-500 ${p.due && p.due < new Date().toISOString().split('T')[0] && p.status !== 'done' ? 'text-primary-500 font-bold' : ''}">${p.due || ''}</span>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderList(el, data) {
            el.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden fade-in">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                            <thead class="bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold uppercase text-xs">
                                <tr>
                                    <th class="px-6 py-4 w-12">IMG</th>
                                    <th class="px-6 py-4 w-20">Code</th>
                                    <th class="px-6 py-4 w-1/3">Project Name</th>
                                    <th class="px-6 py-4">Responsibility</th>
                                    <th class="px-6 py-4">Timeline</th>
                                    <th class="px-6 py-4 text-center">Status</th>
                                    <th class="px-6 py-4 w-32">Progress</th>
                                    <th class="px-6 py-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                                ${data.map(p => `
                                    <tr class="hover:bg-primary-50/30 dark:hover:bg-slate-700/50 transition-colors group">
                                        <td class="px-6 py-4">
                                            <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-700 bg-cover bg-center border border-slate-200 dark:border-slate-600" style="background-image: url('${p.coverUrl || ''}')">
                                                ${!p.coverUrl ? '<div class="w-full h-full flex items-center justify-center text-slate-300 dark:text-slate-500"><i class="fa-solid fa-image"></i></div>' : ''}
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 font-mono text-xs text-slate-400 font-medium">${p.runCode || '-'}</td>
                                        <td class="px-6 py-4">
                                            <div class="font-bold text-slate-900 dark:text-white cursor-pointer hover:text-primary-600 dark:hover:text-primary-400 mb-0.5" onclick="app.openEditor('${p.id}')">${p.name}</div>
                                            <div class="text-[10px] text-slate-400 uppercase tracking-wide bg-slate-100 dark:bg-slate-700 inline-block px-1.5 rounded">${p.cataglory || 'No Cat'}</div>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-2 mb-1"><span class="w-1.5 h-1.5 rounded-full bg-primary-400"></span> <span class="text-xs">${p.responseEng || '-'}</span></div>
                                            <div class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-orange-400"></span> <span class="text-xs">${p.responseTech || '-'}</span></div>
                                        </td>
                                        <td class="px-6 py-4 text-xs font-mono">
                                            <div class="text-slate-500 dark:text-slate-400">S: ${p.start || '...'}</div>
                                            <div class="${p.due && p.due < new Date().toISOString().split('T')[0] && p.status !== 'done' ? 'text-primary-500 font-bold' : 'text-slate-500 dark:text-slate-400'}">D: ${p.due || '...'}</div>
                                        </td>
                                        <td class="px-6 py-4 text-center">
                                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border ${getStatusColor(p.status, true)}">${p.status}</span>
                                        </td>
                                        <td class="px-6 py-4">
                                            <div class="flex items-center gap-2">
                                                <div class="w-full bg-slate-100 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                                    <div class="bg-primary-600 h-1.5 rounded-full" style="width: ${p.progress}%"></div>
                                                </div>
                                                <span class="text-xs font-mono font-medium">${p.progress}%</span>
                                            </div>
                                        </td>
                                        <td class="px-6 py-4 text-right">
                                            <button onclick="app.openEditor('${p.id}')" class="text-slate-400 hover:text-primary-600 mr-3 transition-colors"><i class="fa-solid fa-pen-to-square"></i></button>
                                            <button onclick="store.delete('${p.id}')" class="text-slate-400 hover:text-red-600 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderTimeline(el, data) {
            const sorted = [...data].sort((a,b) => (a.start||'9999').localeCompare(b.start||'9999'));
            
            el.innerHTML = `
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 fade-in overflow-hidden flex flex-col h-[calc(100vh-140px)]">
                    <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-timeline text-primary-500"></i> Project Timeline
                    </h3>
                    
                    <div class="flex-1 overflow-y-auto custom-scroll pr-2">
                        <div class="space-y-4">
                            ${sorted.map(p => {
                                const s = p.start ? new Date(p.start) : null;
                                const e = p.due ? new Date(p.due) : null;
                                let barColor = "bg-slate-200 dark:bg-slate-700";
                                let progressWidth = 0;
                                
                                if(s && e) {
                                    const now = new Date();
                                    const totalDays = (e - s) / (1000 * 60 * 60 * 24);
                                    const elapsed = (now - s) / (1000 * 60 * 60 * 24);
                                    progressWidth = Math.max(0, Math.min(100, (elapsed/totalDays)*100));
                                    
                                    if(p.status === 'done') barColor = "bg-emerald-200 dark:bg-emerald-900";
                                    else if(p.status === 'doing') barColor = "bg-blue-200 dark:bg-blue-900";
                                    else if(p.status === 'overdue') barColor = "bg-primary-200 dark:bg-primary-900";
                                }

                                return `
                                    <div class="group cursor-pointer flex gap-4 items-center" onclick="app.openEditor('${p.id}')">
                                        <div class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-700 bg-cover bg-center shrink-0 border border-slate-200 dark:border-slate-600" style="background-image: url('${p.coverUrl || ''}')"></div>
                                        <div class="flex-1">
                                            <div class="flex justify-between text-xs mb-1 px-1">
                                                <span class="font-bold text-slate-700 dark:text-slate-300">${p.name}</span>
                                                <span class="font-mono text-slate-400">${p.start || '?'} - ${p.due || '?'}</span>
                                            </div>
                                            <div class="h-6 w-full bg-slate-50 dark:bg-slate-700/50 rounded-md relative overflow-hidden border border-slate-100 dark:border-slate-700">
                                                <div class="absolute top-0 bottom-0 left-0 right-0 ${barColor} opacity-30"></div>
                                                <div class="absolute top-0 bottom-0 left-0 bg-primary-500/80 gantt-bar flex items-center justify-end px-2" style="width: ${p.progress}%">
                                                    <span class="text-[9px] text-white font-bold ${p.progress < 10 ? 'hidden':''}">${p.progress}%</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="mt-4 text-xs text-slate-400 text-center border-t border-slate-100 dark:border-slate-700 pt-2">
                        * Timeline view simplifies dates for visual overview. Use Editor for precise scheduling.
                    </div>
                </div>
            `;
        }

        function getStatusColor(s, border = false) {
            const map = {
                'done': 'bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800',
                'doing': 'bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800',
                'overdue': 'bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300 border-primary-200 dark:border-primary-800',
                'todo': 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600'
            };
            const cls = map[s] || map.todo;
            return border ? cls : cls.replace(/border-\w+-\d+/, '').trim();
        }

        // Start
        store.init();

    </script>
</body>
</html>
